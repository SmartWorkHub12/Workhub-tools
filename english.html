<!DOCTYPE html>
<html>
<head>
<title>English Practice - Smart Work Hub</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    text-align:center;
    padding:30px;
}

h1{
    font-size:36px;
}

.card{
    background:white;
    max-width:500px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
}

.word{
    font-size:25px;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>Daily English Practice</h1>

<div class="card">
<div class="word">Improve</div>
<p>उच्चारण: इम्प्रूव</p>
<p>Meaning: सुधारना</p>
<p>Example: I want to improve my English.</p>
</div>

<div class="card">
<div class="word">Believe</div>
<p>उच्चारण: बिलीव</p>
<p>Meaning: विश्वास करना</p>
<p>Example: I believe in myself.</p>
</div>

<div class="card">
<div class="word">Success</div>
<p>उच्चारण: सक्सेस</p>
<p>Meaning: सफलता</p>
<p>Example: Hard work leads to success.</p>
</div>

</body>
</html>
