<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator - Smart Work Hub</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:20px;
}

.container{
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  text-align:center;
}

h1{color:#2563eb;}

input{
  width:90%;
  padding:12px;
  margin:8px 0 18px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.result{
  margin-top:25px;
  font-size:18px;
  line-height:1.8;
}

.error{color:#d00;}
</style>
</head>

<body>

<div class="container">

<h1>⚖️ BMI Calculator</h1>

<p>Enter your height and weight to calculate your BMI.</p>

<label>Height (cm)</label>
<br>
<input type="number" id="height" placeholder="Example: 170">

<br>

<label>Weight (kg)</label>
<br>
<input type="number" id="weight" placeholder="Example: 65">

<br>

<button onclick="calculateBMI()">Calculate BMI</button>

<div id="result" class="result"></div>

</div>

<script>

function calculateBMI(){

  const height = parseFloat(document.getElementById("height").value);
  const weight = parseFloat(document.getElementById("weight").value);
  const result = document.getElementById("result");

  if(!height || !weight || height <= 0 || weight <= 0){
    result.innerHTML =
      '<p class="error">Please enter a valid height and weight.</p>';
    return;
  }

  const heightMeters = height / 100;
  const bmi = weight / (heightMeters * heightMeters);
  const roundedBMI = bmi.toFixed(1);

  let category = "";

  if(bmi < 18.5){
    category = "Underweight";
  }else if(bmi < 25){
    category = "Normal range";
  }else if(bmi < 30){
    category = "Overweight";
  }else{
    category = "Obesity range";
  }

  result.innerHTML =
    "<strong>Your BMI:</strong> " + roundedBMI +
    "<br><strong>Category:</strong> " + category;

}

</script>

</body>
  </html>
