<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - Smart Work Hub</title>
  <meta name="description" content="Free online Password Generator. Create strong and secure passwords quickly with an easy-to-use password generator.">
<meta name="robots" content="index, follow">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:20px;
}

.container{
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  color:#2563eb;
}

input[type="text"]{
  width:90%;
  padding:14px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:15px 0;
}

input[type="number"]{
  width:80px;
  padding:10px;
  font-size:16px;
}

label{
  display:block;
  margin:12px;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  margin:8px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

#message{
  font-size:14px;
  color:green;
  min-height:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 Password Generator</h1>

<p>Create a strong random password instantly.</p>

<input type="text" id="password" readonly placeholder="Your password">

<br>

<label>
Password Length:
<input type="number" id="length" min="6" max="50" value="16">
</label>

<label>
<input type="checkbox" id="uppercase" checked>
Uppercase Letters (A-Z)
</label>

<label>
<input type="checkbox" id="numbers" checked>
Numbers (0-9)
</label>

<label>
<input type="checkbox" id="symbols" checked>
Symbols (!@#$)
</label>

<button onclick="generatePassword()">Generate Password</button>

<button onclick="copyPassword()">Copy Password</button>

<p id="message"></p>

</div>

<script>

function generatePassword(){

let length = parseInt(document.getElementById("length").value);

let chars = "abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("uppercase").checked){
  chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
}

if(document.getElementById("numbers").checked){
  chars += "0123456789";
}

if(document.getElementById("symbols").checked){
  chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";
}

if(chars.length === 0){
  alert("Please select at least one option.");
  return;
}

let password = "";

for(let i = 0; i < length; i++){
  password += chars.charAt(
    Math.floor(Math.random() * chars.length)
  );
}

document.getElementById("password").value = password;
document.getElementById("message").textContent = "";
}

function copyPassword(){

let password = document.getElementById("password").value;

if(password === ""){
  document.getElementById("message").textContent =
  "Generate a password first.";
  return;
}

navigator.clipboard.writeText(password).then(function(){
  document.getElementById("message").textContent =
  "Password copied!";
});

}

generatePassword();

</script>

</body>
  </html>
