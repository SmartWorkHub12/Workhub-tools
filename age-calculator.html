<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator - Smart Work Hub</title>
  <meta name="description" content="Free online Age Calculator. Calculate your exact age quickly and easily in years, months, and days.">
<meta name="robots" content="index, follow">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:20px;
}

.container{
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  color:#2563eb;
}

input{
  width:90%;
  padding:12px;
  margin:8px 0 18px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.result{
  margin-top:25px;
  font-size:18px;
  line-height:1.8;
}

.error{
  color:#d00;
}
</style>
</head>

<body>

<div class="container">

<h1>📅 Age Calculator</h1>

<p>Enter your date of birth to calculate your age.</p>

<label>Date of Birth</label>
<br>
<input type="date" id="dob">

<br>

<button onclick="calculateAge()">Calculate Age</button>

<div id="result" class="result"></div>

</div>

<script>

function calculateAge(){

  const dobValue = document.getElementById("dob").value;
  const result = document.getElementById("result");

  if(!dobValue){
    result.innerHTML = '<p class="error">Please select your date of birth.</p>';
    return;
  }

  const dob = new Date(dobValue + "T00:00:00");
  const today = new Date();

  if(dob > today){
    result.innerHTML = '<p class="error">Date of birth cannot be in the future.</p>';
    return;
  }

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();

  if(days < 0){
    months--;

    const previousMonth = new Date(
      today.getFullYear(),
      today.getMonth(),
      0
    );

    days += previousMonth.getDate();
  }

  if(months < 0){
    years--;
    months += 12;
  }

  result.innerHTML =
    "<strong>Your Age:</strong><br>" +
    years + " Years, " +
    months + " Months, " +
    days + " Days";

}

</script>

</body>
</html>
