<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator - Smart Work Hub</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:20px;
}

.container{
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}

h1{
  color:#2563eb;
  text-align:center;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  margin-top:7px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:13px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:17px;
  cursor:pointer;
}

.result{
  margin-top:25px;
  background:#f0f6ff;
  padding:18px;
  border-radius:8px;
  line-height:1.9;
}

.error{
  color:#d00;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 EMI Calculator</h1>

<p>Calculate your monthly loan EMI, total interest and total payment.</p>

<label>Loan Amount</label>
<input type="number" id="amount" placeholder="Example: 500000">

<label>Annual Interest Rate (%)</label>
<input type="number" id="rate" step="0.01" placeholder="Example: 8.5">

<label>Loan Tenure (Years)</label>
<input type="number" id="years" placeholder="Example: 5">

<button onclick="calculateEMI()">Calculate EMI</button>

<div id="result" class="result"></div>

</div>

<script>

function calculateEMI(){

  const amount = parseFloat(document.getElementById("amount").value);
  const annualRate = parseFloat(document.getElementById("rate").value);
  const years = parseFloat(document.getElementById("years").value);
  const result = document.getElementById("result");

  if(!amount || !annualRate || !years ||
     amount <= 0 || annualRate < 0 || years <= 0){

    result.innerHTML =
      '<p class="error">Please enter valid loan details.</p>';
    return;
  }

  const months = years * 12;
  const monthlyRate = annualRate / 12 / 100;

  let emi;

  if(monthlyRate === 0){
    emi = amount / months;
  }else{
    emi =
      amount *
      monthlyRate *
      Math.pow(1 + monthlyRate, months) /
      (Math.pow(1 + monthlyRate, months) - 1);
  }

  const totalPayment = emi * months;
  const totalInterest = totalPayment - amount;

  result.innerHTML =
    "<strong>Monthly EMI:</strong> ₹" + emi.toFixed(2) +
    "<br><strong>Total Interest:</strong> ₹" + totalInterest.toFixed(2) +
    "<br><strong>Total Payment:</strong> ₹" + totalPayment.toFixed(2);

}

</script>

</body>
  </html>
